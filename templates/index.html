<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XPhoneClawControl - 手机群控系统</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
/* ===== Global Reset ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #121218;
  color: #e0e0e0;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* ===== Toolbar (top bar) ===== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  height: 46px;
  background: #0a0a10;
  border-bottom: 1px solid #1e1e28;
  font-size: 13px;
  user-select: none;
  flex-shrink: 0;
}

.toolbar .brand {
  font-weight: 700;
  font-size: 14px;
  color: #ff6b6b;
  margin-right: auto;
  letter-spacing: 0.5px;
}

.toolbar .page-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.toolbar .page-btn {
  background: #16161e;
  color: #aaa;
  border: 1px solid #222230;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.12s, color 0.12s;
}
.toolbar .page-btn:hover:not(:disabled) { background: #1e2a3a; color: #d0d0d0; }
.toolbar .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.toolbar .page-info {
  color: #666;
  font-size: 12px;
  min-width: 80px;
  text-align: center;
}

.toolbar .hint { color: #444; font-size: 11px; }
.toolbar .refresh-btn {
  background: #16161e;
  color: #aaa;
  border: 1px solid #222230;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  transition: background 0.12s;
}
.toolbar .refresh-btn:hover { background: #1e2a3a; color: #d0d0d0; }

/* ===== Phone Wall Container ===== */
.phone-wall {
  height: calc(100vh - 46px);
  overflow-y: auto;
  overflow-x: auto;
  display: flex;
  align-items: flex-start;
  padding-top: 0;
  background: #121218;
  scrollbar-width: thin;
  scrollbar-color: #222 #121218;
}
.phone-wall::-webkit-scrollbar { width: 8px; height: 8px; }
.phone-wall::-webkit-scrollbar-track { background: #121218; }
.phone-wall::-webkit-scrollbar-thumb {
  background: #222;
  border-radius: 4px;
}
.phone-wall::-webkit-scrollbar-thumb:hover { background: #333; }

.grid-area {
  display: grid;
  grid-template-columns: repeat(8, var(--cw));
  gap: var(--gap);
  padding: 12px;
  width: calc(8 * var(--cw) + 7 * var(--gap));
  margin: 0 auto;
}

.slot {
  background: #16161e;
  border: 2px solid #222230;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  width: var(--cw);
  height: auto;
  position: relative;
  transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  will-change: transform;
  display: none;
}
.slot.vis { display: block; }
.slot:hover {
  border-color: #ff6b6b;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 107, 107, 0.15);
  z-index: 10;
}

.slot .dot {
  position: absolute;
  top: 6px;
  right: 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  z-index: 20;
}
.slot .dot.on {
  background: #4caf50;
  box-shadow: 0 0 6px #4caf5088;
}
.slot .dot.off { background: #f44336; }

.slot .screen {
  width: 100%;
  aspect-ratio: 9/16;
  background: #050510;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.slot .screen .cam {
  width: 5px;
  height: 5px;
  background: #222;
  border-radius: 50%;
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
}
.slot .screen .placeholder-icon {
  font-size: 24px;
  opacity: 0.12;
  margin-bottom: 4px;
}
.slot .screen .placeholder-text {
  font-size: 9px;
  color: #333;
}
.slot .screen video, .slot .screen canvas {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  top: 0;
  left: 0;
}

.slot .label-bar {
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0e0e14;
  font-size: 8px;
  color: #555;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  padding: 0 4px;
}

/* ===== Expand Overlay ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s;
}
.overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.overlay .panel {
  display: flex;
  flex-direction: column;
  width: min(520px, calc(100vw - 40px));
  background: #0a0a10;
  border: 2px solid #2a2a38;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(255, 107, 107, 0.08);
  transform: scale(0.9);
  opacity: 0;
  transition: transform 0.22s ease-out, opacity 0.15s;
}
.overlay.show .panel {
  transform: scale(1);
  opacity: 1;
}

.panel .expanded-screen {
  width: 100%;
  background: #050510;
  position: relative;
  display: flex;
  flex-direction: column;
}

.panel .exp-screen .scrcpy-tool-strip {
  height: 40px;
  background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.panel .exp-screen .scrcpy-tool-strip .scrcpy-btn {
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  color: #777;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.panel .exp-screen .scrcpy-tool-strip .scrcpy-btn:hover {
  background: rgba(255,107,107,0.2);
  color: #ff6b6b;
  border-color: rgba(255,107,107,0.3);
}

.panel .exp-screen .screen-content {
  width: 100%;
  aspect-ratio: 9/16;
  position: relative;
  display: flex;
  flex-direction: column;
}
.panel .exp-screen .screen-content .top-bar {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
  z-index: 2;
}
.panel .exp-screen .screen-content .top-bar .dev-title {
  font-size: 12px;
  color: #ff6b6b;
  font-weight: 600;
}
.panel .exp-screen .screen-content .top-bar .close-sm {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  color: #888;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.12s;
}
.panel .exp-screen .screen-content .top-bar .close-sm:hover { background: rgba(255,255,255,0.2); }

.panel .exp-screen .screen-content .mirror-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  position: relative;
  z-index: 1;
}
.panel .exp-screen .screen-content .mirror-area video,
.panel .exp-screen .screen-content .mirror-area canvas {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.panel .exp-screen .screen-content .mirror-area .big-icon {
  font-size: 48px;
  opacity: 0.08;
  margin-bottom: 8px;
}
.panel .exp-screen .screen-content .mirror-area .big-label {
  color: #444;
  font-size: 13px;
  margin-bottom: 3px;
}
.panel .exp-screen .screen-content .mirror-area .big-sub {
  color: #333;
  font-size: 11px;
}

.panel .actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 12px;
  background: #0e0e14;
  border-top: 1px solid #1a1a24;
  flex-wrap: wrap;
}
.panel .actions button {
  background: #16161e;
  color: #aaa;
  border: 1px solid #222230;
  padding: 5px 12px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: background 0.12s, color 0.12s;
}
.panel .actions button:hover {
  background: #1e2a3a;
  color: #d0d0d0;
}
.panel .actions .close-btn {
  margin-left: auto;
  background: #2a1520;
  color: #ff6b6b;
  border-color: #3a2030;
}
.panel .actions .close-btn:hover { background: #3a2030; }

/* Loading indicator */
.loading-spinner {
  width: 20px;
  height: 20px;
  border: 2px solid #333;
  border-top-color: #ff6b6b;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ===== TOOLBAR ===== -->
<div class="toolbar">
  <span class="brand">XPHONE CLAW CONTROL</span>
  <div class="page-controls">
    <button class="page-btn" id="prevPageBtn">&#9664; 上一页</button>
    <span class="page-info" id="pageInfo">第 1 / 1 页</span>
    <button class="page-btn" id="nextPageBtn">下一页 &#9654;</button>
  </div>
  <span class="hint" style="margin-left:12px;">每页最多 24 台设备 (8x3 固定网格)</span>
  <button class="refresh-btn" id="refreshBtn">&#8635; 刷新</button>
</div>

<!-- ===== PHONE WALL ===== -->
<div class="phone-wall" id="wall">
  <div class="grid-area" id="grid"></div>
</div>

<!-- ===== EXPAND OVERLAY ===== -->
<div class="overlay" id="overlay">
  <div class="panel">
    <div class="expanded-screen">
      <div class="exp-screen">
        <div class="scrcpy-tool-strip">
          <span class="scrcpy-btn" id="expScreenshot" title="截屏">&#128248;</span>
          <span class="scrcpy-btn" id="expRecord" title="录屏">&#128265;</span>
          <span class="scrcpy-btn" id="expKeyboard" title="键盘">&#9997;</span>
          <span class="scrcpy-btn" id="expMouse" title="鼠标">&#128254;</span>
          <span class="scrcpy-btn" id="expFullscreen" title="全屏">&#10064;</span>
        </div>
        <div class="screen-content">
          <div class="top-bar">
            <span class="dev-title" id="devName"></span>
            <span class="close-sm" id="closeSm">&#10005;</span>
          </div>
          <div class="mirror-area" id="mirrorArea">
            <div class="big-icon">&#128241;</div>
            <div class="big-label">点击卡片查看实时画面</div>
            <div class="big-sub">9:16 共展比例</div>
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button id="actionScreenshot">&#128248; 截图</button>
      <button id="actionRecord">&#128265; 录屏</button>
      <button id="actionKeyboard">&#9997;&#65039; 键鼠</button>
      <button id="actionRotate">&#128254; 旋转</button>
      <button id="actionFullscreen">&#10064; 全屏</button>
      <button class="close-btn" id="closeMain">&#10005; 关闭</button>
    </div>
  </div>
</div>

<script>
/* ===== Configuration ===== */
const COLS = 8;
const ROWS = 3;
const GAP = 8;
const PADDING = 12;

// Socket.IO connection
let socket = null;
let connectedDevices = [];
let currentDeviceSerial = null;

// Pagination settings
const DEVICES_PER_PAGE = 24;
const COLS = 8;
const ROWS = 3;
let currentPage = 1;
let totalPages = 1;

// Device names fallback
const deviceNames = [
  'Pixel-7-Pro','Galaxy-S24','iPhone-15','OnePlus-12',
  'Xiaomi-14','Honor-Magic6','Vivo-X100','Oppo-Reno',
  'Samsung-A54','Motorola-Edge','Realme-11','Nubia-Z60',
  'Nothing-PH2','Sony-Xperia','LG-GPad','RedMagic-9',
  'ASUS-ROG','BlackShark-5','Cuco-C70','Infinix-ZT',
  'Tecno-Pova','Itel-S23','Samsung-M14','Nokia-G42'
];

let currentCardW = 0;
let currentCardH = 0;

function getCols(count) {
  return Math.min(8, count);
}

function recalc() {
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  const availableW = winW - PADDING * 2;
  const availableH = winH - 46 - PADDING * 2;

  let cardW = Math.floor((availableW - GAP * 7) / 8);
  let cardH = Math.floor(cardW * (16 / 9));

  const maxH = Math.floor((availableH - GAP * 2) / ROWS);
  if (cardH > maxH) {
    cardH = maxH;
    cardW = Math.floor(cardH * (9 / 16));
  }

  cardW = Math.max(cardW, 64);
  cardH = Math.max(cardH, Math.floor(cardW * 0.563));

  currentCardW = cardW;
  currentCardH = cardH;

  const grid = document.getElementById('grid');
  grid.style.setProperty('--cw', cardW + 'px');
  grid.style.setProperty('--gap', GAP + 'px');
  grid.style.setProperty('--rh', cardH + 'px');
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const totalCells = DEVICES_PER_PAGE;
  const startIndex = (currentPage - 1) * DEVICES_PER_PAGE;
  
  for (let i = 0; i < totalCells; i++) {
    const slotIndex = startIndex + i;
    const slot = document.createElement('div');
    
    if (slotIndex < connectedDevices.length) {
      const device = connectedDevices[slotIndex];
      slot.classList.add('slot', 'vis');
      slot.dataset.serial = device.serial;
      slot.dataset.idx = slotIndex;
      slot.title = device.name + ' (点击展开)';

      const online = device.status === 'online';
      
      slot.innerHTML = `
        <div class="dot ${online ? 'on' : 'off'}"></div>
        <div class="screen">
          <div class="cam"></div>
          <div class="placeholder-icon">&#128241;</div>
          <div class="placeholder-text">${device.name}</div>
        </div>
        <div class="label-bar" title="${device.name}">${device.name}</div>
      `;
      slot.addEventListener('click', () => openExpand(device));
    } else {
      slot.classList.add('slot');
    }

    grid.appendChild(slot);
  }
  
  updatePageInfo();
}

function updatePageInfo() {
  totalPages = Math.ceil(connectedDevices.length / DEVICES_PER_PAGE) || 1;
  currentPage = Math.min(currentPage, totalPages);
  
  const pageInfo = document.getElementById('pageInfo');
  pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
  
  document.getElementById('prevPageBtn').disabled = currentPage <= 1;
  document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
}

function updateDevices(devices) {
  connectedDevices = devices;
  currentPage = 1;
  render();
}

function goToPage(page) {
  totalPages = Math.ceil(connectedDevices.length / DEVICES_PER_PAGE) || 1;
  if (page >= 1 && page <= totalPages) {
    currentPage = page;
    render();
  }
}

function nextPage() {
  goToPage(currentPage + 1);
}

function prevPage() {
  goToPage(currentPage - 1);
}

// Overlay functions
const overlay = document.getElementById('overlay');

function openExpand(device) {
  currentDeviceSerial = device.serial;
  document.getElementById('devName').textContent = device.name;
  
  // Clear mirror area and show loading
  const mirrorArea = document.getElementById('mirrorArea');
  mirrorArea.innerHTML = '<div class="loading-spinner"></div><div style="color:#444;font-size:11px;margin-top:8px;">连接中...</div>';
  
  overlay.classList.add('show');
  
  // Request stream start
  if (socket && socket.connected) {
    socket.emit('start_device', { serial: device.serial });
  }
}

function closeExpand() {
  overlay.classList.remove('show');
  currentDeviceSerial = null;
  
  // Clean up video element
  const mirrorArea = document.getElementById('mirrorArea');
  mirrorArea.innerHTML = `
    <div class="big-icon">&#128241;</div>
    <div class="big-label">点击卡片查看实时画面</div>
    <div class="big-sub">9:16 共展比例</div>
  `;
}

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeExpand();
});
document.getElementById('closeSm').addEventListener('click', closeExpand);
document.getElementById('closeMain').addEventListener('click', closeExpand);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeExpand();
});

// Initialize Socket.IO connection
function initSocket() {
  socket = io(window.location.origin, {
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionAttempts: 10,
    reconnectionDelay: 1000
  });

  socket.on('connect', () => {
    console.log('已连接到服务器');
    socket.emit('refresh_devices');
  });

  socket.on('disconnect', () => {
    console.log('与服务器断开连接');
  });

  socket.on('devices_updated', (devices) => {
    console.log('设备列表更新:', devices);
    updateDevices(devices);
  });

  socket.on('device_status', (data) => {
    console.log('设备状态:', data);
    if (data.serial === currentDeviceSerial && data.status === 'online') {
      // Start video stream
      setupVideoStream(data.serial, data.port);
    }
  });

  socket.on('screenshot_taken', (data) => {
    console.log('截图完成:', data.path);
    alert('截图已保存：' + data.path);
  });

  socket.on('error', (data) => {
    console.error('错误:', data.message);
    alert('错误：' + data.message);
  });
}

function setupVideoStream(serial, port) {
  const mirrorArea = document.getElementById('mirrorArea');
  
  // For now, show placeholder since we need actual video stream
  // In production, this would connect to the scrcpy video stream
  mirrorArea.innerHTML = `
    <div style="color:#4caf50;font-size:12px;text-align:center;">
      <div>&#128247;</div>
      <div style="margin-top:8px;">设备已连接</div>
      <div style="color:#555;font-size:10px;margin-top:4px;">${serial}</div>
      <div style="color:#555;font-size:10px;">端口：${port || 'N/A'}</div>
    </div>
  `;
}

// Event listeners for pagination
document.getElementById('prevPageBtn').addEventListener('click', prevPage);
document.getElementById('nextPageBtn').addEventListener('click', nextPage);

document.getElementById('refreshBtn').addEventListener('click', function() {
  if (socket && socket.connected) {
    socket.emit('refresh_devices');
  }
});

// Action buttons in overlay
document.getElementById('actionScreenshot').addEventListener('click', function() {
  if (currentDeviceSerial && socket) {
    socket.emit('take_screenshot', { serial: currentDeviceSerial });
  }
});

document.getElementById('expScreenshot').addEventListener('click', function() {
  if (currentDeviceSerial && socket) {
    socket.emit('take_screenshot', { serial: currentDeviceSerial });
  }
});

document.getElementById('actionRecord').addEventListener('click', function() {
  alert('录屏功能开发中...');
});

document.getElementById('actionKeyboard').addEventListener('click', function() {
  const text = prompt('输入要发送的文本:');
  if (text && currentDeviceSerial && socket) {
    socket.emit('input_text', { serial: currentDeviceSerial, text: text });
  }
});

document.getElementById('actionRotate').addEventListener('click', function() {
  if (currentDeviceSerial && socket) {
    socket.emit('input_key', { serial: currentDeviceSerial, keycode: 82 }); // MENU key
  }
});

document.getElementById('actionFullscreen').addEventListener('click', function() {
  const panel = document.querySelector('.overlay .panel');
  if (panel.requestFullscreen) {
    panel.requestFullscreen();
  }
});

// Initialize
window.addEventListener('resize', () => {
  recalc();
  render();
});

initSocket();
recalc();
render();
</script>

</body>
</html>
